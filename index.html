<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inicio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <p class="eyebrow" id="date"></p>
      <h1>Inicio</h1>
      <form class="search" action="https://duckduckgo.com/" method="get">
        <input name="q" type="search" autocomplete="off" autofocus placeholder="Buscar en DuckDuckGo…" />
        <button type="submit">Buscar</button>
      </form>
    </section>

    <section class="grid" aria-label="Accesos rápidos">
      <a class="card" href="https://chat.openai.com/">ChatGPT</a>
      <a class="card" href="https://github.com/">GitHub</a>
      <a class="card" href="https://mail.proton.me/">Proton Mail</a>
      <a class="card" href="https://www.youtube.com/">YouTube</a>
      <a class="card" href="https://lichess.org/">Lichess</a>
      <a class="card" href="https://www.tradingview.com/">TradingView</a>
      <a class="card" href="https://www.google.com/maps">Maps</a>
      <a class="card" href="https://www.wikipedia.org/">Wikipedia</a>
    </section>

    <section class="notes">
      <h2>Foco del día</h2>
      <p>Una tarea concreta. Un bloque de avance. Cero ruido innecesario.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
